<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- ── Splash écran immédiat — même écran que le Catalogue Électrique
       (index.html racine), copié tel quel (mêmes id/classes) : les deux
       pages partagent la même origine, donc le même sessionStorage
       (app_started, voir le script juste en dessous et demarrer() dans
       commandes-immo/js/app.js) — la vidéo ne rejoue qu'une fois par
       session de navigation, quelle que soit la page ouverte en premier. ── -->
  <style>
    #app-splash{
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      margin-top:calc(-1 * env(safe-area-inset-top, 0));
      z-index:99999;
      background:#194093;
      display:var(--splash-display, block);
      transition:opacity .3s ease;
      overflow:hidden;
    }
    #app-splash video{
      position:absolute;
      top:calc(-1 * env(safe-area-inset-top, 0));
      left:0;right:0;bottom:0;
      width:100%;
      height:calc(100% + env(safe-area-inset-top, 0) + env(safe-area-inset-bottom, 0));
      object-fit:cover;
      object-position:center center;
    }
    @media (max-width: 1024px){
      #app-splash video{
        width:65%; height:65%; top:50%; left:50%;
        transform:translate(-50%,-50%);
      }
    }
    @media (max-width: 480px){
      #app-splash video{
        width:50%; height:50%; top:50%; left:50%;
        transform:translate(-50%,-50%);
      }
    }
    body.splash-active{ overflow:hidden; position:fixed; width:100%; touch-action:none; }
    #app-splash.hide{ opacity:0; pointer-events:none; }
    body:not(:has(#app-splash:not(.hide))){ background:var(--paper, #F8F7F4) !important; }
  </style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes IMMO — SPI / SPIL</title>
<!-- Charte SPI RÉELLEMENT partagée avec le Catalogue Électrique (racine du
     site) plutôt qu'une copie locale : mêmes jetons de couleur, mêmes
     composants (en-tête, menu ⋮, boutons, toasts…), un seul fichier à faire
     évoluer pour les deux outils. Seul commandes-immo/css/commandes.css
     ci-dessous contient ce qui est propre à cet outil (cartes, formulaires,
     éditeurs, tableau des commandes, fenêtres…). -->

<script>(function(){
  // Même script que le Catalogue Électrique (index.html racine), placé au
  // même endroit — juste après l'ouverture de <body>, où document.body
  // existe déjà — pas dans <head>.
  if(sessionStorage.getItem('app_started')){
    document.documentElement.style.setProperty('--splash-display','none');
  } else {
    document.body.classList.add('splash-active');
  }
  document.addEventListener('ended', function(e){
    if(!e.target || e.target.tagName !== 'VIDEO') return;
    var s = document.getElementById('app-splash');
    if(!s || !s.contains(e.target)) return;
    s.classList.add('hide');
    document.body.classList.remove('splash-active');
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 400);
  }, true);
})();</script>
<div id="app-splash">
  <video autoplay muted playsinline preload="auto">
    <source src="assets/splash.mp4" type="video/mp4">
  </video>
</div>
